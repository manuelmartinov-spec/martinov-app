.gdb{display:flex;gap:8px;flex-wrap:wrap;margin-top:4px}.gdb button{font:600 14px "Figtree",system-ui,sans-serif;border-radius:10px;padding:10px 16px;min-height:42px;cursor:pointer;border:1px solid #E2DCD2;background:#fff;color:#232B36}
.gdb .gdy{background:#333F50;border-color:#333F50;color:#fff}
@media (prefers-color-scheme: dark){.gdbox{background:#1F252D;color:#E7E3DC}.gdbox p{color:#9AA2AD}.gdbox .gdn{background:#252C35}.gdb button{background:#1F252D;color:#E7E3DC;border-color:#323A45}}
.pkey{font:600 14px "IBM Plex Mono",monospace;background:#F4F1EC;border-radius:8px;padding:8px 10px;word-break:break-all;user-select:all}
@media (prefers-color-scheme: dark){.pkey{background:#252C35}}

.pwrap{display:flex;flex-direction:column;gap:8px}

.pushc .pf{display:flex;flex-direction:column;gap:3px;min-width:0}
.pushc .pf select{width:100%;min-width:0}
.pushc .prow{display:flex;flex-wrap:wrap;gap:8px}
.pushc .btn.pri{align-self:flex-start}
.plist{display:flex;flex-direction:column;gap:6px;font-size:13px}
.plist .pitem{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:6px 10px;border:1px solid var(--line,#E2DCD2);border-radius:10px}

</script></head><body><div id="login" data-s="wait"><div class="lbox"><img src="icons/m-icon-192.png" alt="" width="76" height="76"><h1>Martinov Design</h1><p id="loginMsg">Učitavam…</p>
<button type="button" class="btn pri" id="loginBtn">Prijavi se Google nalogom</button><button type="button" class="btn" id="loginOut">Odjavi se i probaj drugi nalog</button>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: aplikacija preko celog ekrana — levo spisak tabela (na telefonu fioka), gore naziv tabele, prikazi i alati, ispod tabela/kartice/kanban/kalendar koji se skroluju sami; zapis se otvara u donjem listu */
:root{
  --bg:#F4F1EC; --panel:#FFFFFF; --fg:#232B36; --muted:#6E7682; --line:#E2DCD2; --grid:#ECE7DF; --head:#FAF8F4;
  --navy:#333F50; --gold:#B99C71; --gold-soft:#F3ECE1; --ok:#2F7D57; --warn:#A86B12; --bad:#B0412E; --bad-soft:#F6E4DF;
  --field:#FBFAF7; --hover:#F8F5F0; --rowsel:#EEF3FA; --focus:#3B76C4; --scrim:rgba(20,24,30,.45); --lift:rgba(35,43,54,.12);
  --c1:#3B76C4; --c2:#2F8A57; --c3:#D07A1E; --c4:#7E57C2; --c5:#16969C; --c6:#C2477F; --c7:#8C6A3F; --c8:#55657A; --c9:#B0412E;
  --f-ui:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-num:"IBM Plex Mono",ui-monospace,"Consolas",monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#171B21;--panel:#1F252D;--fg:#E7E3DC;--muted:#9AA2AD;--line:#323A45;--grid:#2A313B;--head:#232A33;--navy:#C9D3E0;--gold:#CDB089;--gold-soft:#2B2A26;--ok:#5DBB8C;--warn:#E0A84A;--bad:#E07A66;--bad-soft:#3A2622;--field:#252C35;--hover:#252C35;--rowsel:#22303F;--focus:#6FA3E8;--scrim:rgba(0,0,0,.6);--lift:rgba(0,0,0,.4);--c1:#6FA3E8;--c2:#5DBB86;--c3:#EBA154;--c4:#A98BE6;--c5:#4CC3C8;--c6:#E57FAE;--c7:#C49A6A;--c8:#93A3B8;--c9:#E07A66;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#171B21;--panel:#1F252D;--fg:#E7E3DC;--muted:#9AA2AD;--line:#323A45;--grid:#2A313B;--head:#232A33;--navy:#C9D3E0;--gold:#CDB089;--gold-soft:#2B2A26;--ok:#5DBB8C;--warn:#E0A84A;--bad:#E07A66;--bad-soft:#3A2622;--field:#252C35;--hover:#252C35;--rowsel:#22303F;--focus:#6FA3E8;--scrim:rgba(0,0,0,.6);--lift:rgba(0,0,0,.4);--c1:#6FA3E8;--c2:#5DBB86;--c3:#EBA154;--c4:#A98BE6;--c5:#4CC3C8;--c6:#E57FAE;--c7:#C49A6A;--c8:#93A3B8;--c9:#E07A66;color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--f-ui);font-size:14px;line-height:1.4;overflow:hidden;-webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--panel)}
button{font:600 13px var(--f-ui);color:var(--fg);cursor:pointer}
input,select,textarea{font:16px var(--f-ui);color:var(--fg);background:var(--field);border:1px solid var(--line);border-radius:8px;padding:7px 10px;min-width:0;min-height:38px}
textarea{resize:vertical;line-height:1.45;width:100%}
:focus-visible{outline:2px solid var(--focus);outline-offset:1px}
.ic{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none}
.ic .fl{fill:currentColor;stroke:none}
.sp{flex:1}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:7px 12px;min-height:36px;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:hover{background:var(--hover)}
.pri{background:var(--navy);border-color:var(--navy);color:var(--panel)}
.pri:hover{background:var(--navy);filter:brightness(1.12)}
.ghost{background:none;border-color:transparent}
.danger{color:var(--bad)}
.dfill{background:var(--bad);border-color:var(--bad);color:var(--panel)}
.iconbtn{border:0;background:none;width:38px;height:38px;border-radius:8px;display:inline-flex;align-items:center;justify-content:center;color:var(--muted);padding:0;flex:none}
.iconbtn:hover{background:var(--hover);color:var(--fg)}
.ti{display:inline-flex;align-items:center;justify-content:center;min-width:18px;height:18px;padding:0 3px;border-radius:4px;background:var(--gold-soft);color:var(--muted);font:500 10.5px var(--f-num);flex:none;letter-spacing:0}

/* ---- okvir ---- */
#app{display:flex;height:100%}
#side{width:250px;flex:none;background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;padding-left:env(safe-area-inset-left,0px);z-index:40}
.sbrand{display:flex;align-items:center;gap:8px;padding:14px 12px 10px 18px}
.brand{font-weight:700;letter-spacing:.14em;text-transform:uppercase;font-size:13px;color:var(--navy);display:flex;align-items:baseline;gap:8px}
.brand small{font-weight:500;letter-spacing:.06em;color:var(--gold);text-transform:none;font-size:12px}
#sideX{display:none}
.slabel{font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:700;padding:8px 18px 4px}
#tlist{flex:1;overflow:auto;padding:2px 8px 8px;display:flex;flex-direction:column;gap:1px}
.titem{display:flex;align-items:center;gap:10px;width:100%;border:0;background:none;padding:7px 10px;border-radius:9px;text-align:left;font:500 14px var(--f-ui);min-height:40px}
.titem:hover{background:var(--hover)}
.titem[aria-current="true"]{background:var(--gold-soft);font-weight:600}
.titem .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.titem .ct{font:500 11.5px var(--f-num);color:var(--muted)}
.tico{width:26px;height:26px;border-radius:7px;background:var(--c,var(--c1));color:var(--panel);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:12.5px;flex:none;text-transform:uppercase}
.sfoot{border-top:1px solid var(--line);padding:10px 10px calc(10px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:8px}
.sfoot .btn{justify-content:center}
.conn{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px;white-space:nowrap;padding:0 8px}
.conn::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--muted);flex:none}
.conn.ok::before{background:var(--ok)}.conn.saving::before{background:var(--warn)}.conn.off::before,.conn.err::before,.conn.ro::before{background:var(--bad)}
#sideScrim{position:fixed;inset:0;background:var(--scrim);z-index:35}

#main{flex:1;min-width:0;display:flex;flex-direction:column;background:var(--bg)}
.bar{background:var(--panel);border-bottom:1px solid var(--line);padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px))}
.row1{display:flex;align-items:center;gap:6px;min-height:52px;padding-top:4px}
#menuBtn{display:none}
.tname{border:0;background:none;display:flex;align-items:center;gap:10px;font:700 19px var(--f-ui);padding:6px 8px;border-radius:9px;min-width:0;max-width:100%}
.tname:hover{background:var(--hover)}
.tname .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tname .tico{width:28px;height:28px;font-size:13px}
.tname .ic{width:16px;height:16px;color:var(--muted)}
#conn2{display:none}
.views{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;margin-top:2px}
.views::-webkit-scrollbar{display:none}
.vtab{border:0;background:none;display:flex;align-items:center;gap:7px;padding:8px 12px;border-radius:8px 8px 0 0;color:var(--muted);font:600 13.5px var(--f-ui);white-space:nowrap;border-bottom:2px solid transparent;min-height:38px}
.vtab:hover{color:var(--fg);background:var(--hover)}
.vtab[aria-current="true"]{color:var(--fg);border-bottom-color:var(--navy)}
.vtab .ic{width:16px;height:16px}
.vtab.add{color:var(--muted);font-weight:500}
.tools{display:flex;gap:6px;align-items:center;padding-block:8px;border-top:1px solid var(--line)}
.tools .srch{flex:0 1 230px;min-width:120px;position:relative}
.tools .srch input{width:100%;min-height:36px;padding:6px 10px 6px 32px;font-size:14px}
.tools .srch .ic{position:absolute;left:9px;top:9px;width:16px;height:16px;color:var(--muted);pointer-events:none}
.tbtn{border:1px solid transparent;background:none;border-radius:8px;padding:6px 10px;min-height:36px;display:inline-flex;align-items:center;gap:6px;color:var(--fg);font-weight:500;white-space:nowrap}
.tbtn:hover{background:var(--hover)}
.tbtn.on{background:var(--gold-soft);border-color:var(--line);font-weight:600}
.tbtn .ic{width:16px;height:16px}
.tbtn .lb2{max-width:150px;overflow:hidden;text-overflow:ellipsis}
.banner{margin:10px 12px 0;padding:10px 12px;border-radius:10px;background:var(--bad-soft);color:var(--bad);font-size:13px;line-height:1.45}
#content{flex:1;min-height:0;overflow:auto;position:relative;outline:none;overscroll-behavior:contain}

/* ---- tabela (grid) ---- */
table.g{border-collapse:separate;border-spacing:0;table-layout:fixed;background:var(--panel);font-size:13.5px;margin-bottom:0}
.g th,.g td{border-right:1px solid var(--grid);border-bottom:1px solid var(--grid);height:36px;padding:0 9px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:left;vertical-align:middle;background:var(--panel)}
.g thead th{position:sticky;top:0;z-index:3;background:var(--head);font-weight:600;font-size:12.5px;color:var(--fg);padding:0;border-bottom:1px solid var(--line)}
.g .rn{position:sticky;left:0;z-index:2;width:64px;text-align:left;color:var(--muted);font:500 11.5px var(--f-num);padding:0 0 0 8px;text-overflow:clip}
.g .pk{position:sticky;left:64px;z-index:2;border-right:1px solid var(--line);font-weight:500}
.g thead .rn,.g thead .pk{z-index:4}
.g tfoot td{position:sticky;bottom:0;z-index:3;background:var(--head);border-top:1px solid var(--line);font:500 12px var(--f-num);color:var(--muted);height:34px}
.g tfoot .rn,.g tfoot .pk{z-index:4}
.g tfoot td.sum{color:var(--fg);text-align:right}
.g tfoot td.sum small{color:var(--muted);font-size:10.5px;margin-right:6px;letter-spacing:.06em}
.g tbody tr:hover td{background:var(--hover)}
.g tbody tr.rsel td{background:var(--rowsel)}
.g td.sel{box-shadow:inset 0 0 0 2px var(--focus)}
.g td.ed{padding:0;box-shadow:inset 0 0 0 2px var(--focus);background:var(--panel)}
.g td.ed input{width:100%;height:100%;border:0;border-radius:0;background:var(--panel);font:inherit;font-size:13.5px;padding:0 9px;min-height:0;outline:none}
.g td.ed input.num{text-align:right;font-family:var(--f-num)}
.fh{display:flex;align-items:center;gap:7px;width:100%;height:36px;border:0;background:none;padding:0 9px;font:600 12.5px var(--f-ui);text-align:left;min-width:0}
.fh:hover{background:var(--hover)}
.fh .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;min-width:0}
.fh .sa{color:var(--focus);font-size:12px}
.thw{position:relative;height:36px}
.rz{position:absolute;right:-3px;top:0;bottom:0;width:7px;cursor:col-resize;z-index:2}
.rz:hover,.rz.on{background:var(--focus);opacity:.5}
.addc{width:48px}
.addc button{width:100%;height:36px;border:0;background:none;color:var(--muted);display:flex;align-items:center;justify-content:center}
.addc button:hover{background:var(--hover);color:var(--fg)}
.g .rn .num{display:inline-block;min-width:22px}
.g .exp{border:0;background:none;color:var(--muted);width:26px;height:26px;border-radius:6px;padding:0;display:inline-flex;align-items:center;justify-content:center;vertical-align:middle;opacity:0}
.g tr:hover .exp,.g tr.rsel .exp{opacity:1}
.g .exp:hover{background:var(--gold-soft);color:var(--fg)}
.g .exp .ic{width:14px;height:14px}
@media (pointer:coarse){.g .exp{opacity:1}}
.g td.n{text-align:right;font-family:var(--f-num);font-size:12.5px}
.g td.c{text-align:center}
.g td.ro{color:var(--fg)}
.g tr.gh td{background:var(--gold-soft);height:38px;padding:0 10px;font-weight:600;border-bottom:1px solid var(--line)}
.g tr.gh td.ghl{position:sticky;left:0;z-index:2}
.ghb{border:0;background:none;display:inline-flex;align-items:center;gap:8px;font:600 13px var(--f-ui);padding:4px 4px;max-width:100%}
.ghb .car{display:inline-block;transition:transform .12s;color:var(--muted)}
.ghb[aria-expanded="false"] .car{transform:rotate(-90deg)}
.ghb .cnt{font:500 11.5px var(--f-num);color:var(--muted)}
.g tr.addr td{height:38px;padding:0;background:var(--panel)}
.g tr.addr td.ghl{position:sticky;left:0;z-index:2}
.addr button{border:0;background:none;color:var(--muted);display:flex;align-items:center;gap:6px;height:38px;padding:0 12px;font:500 13px var(--f-ui);width:100%;white-space:nowrap}
.addr button:hover{color:var(--fg);background:var(--hover)}
.pill{display:inline-block;padding:2px 9px;border-radius:99px;background:color-mix(in srgb,var(--c,var(--c8)) 17%,var(--panel));color:var(--fg);font-size:12.5px;font-weight:500;margin-right:4px;line-height:1.45;max-width:100%;overflow:hidden;text-overflow:ellipsis;vertical-align:middle;white-space:nowrap}
.pill.dot::before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--c,var(--c8));margin-right:6px;vertical-align:1px}
.lchip{display:inline-block;padding:1px 8px;border-radius:6px;background:var(--field);border:1px solid var(--line);font-size:12.5px;margin-right:4px;max-width:100%;overflow:hidden;text-overflow:ellipsis;vertical-align:middle;white-space:nowrap;color:var(--fg)}
.cb{display:inline-block;width:19px;height:19px;border-radius:5px;border:2px solid var(--muted);position:relative;vertical-align:middle}
.cb.on{background:var(--ok);border-color:var(--ok)}
.cb.on::after{content:"";position:absolute;left:4.5px;top:1px;width:5px;height:10px;border:solid var(--panel);border-width:0 2px 2px 0;transform:rotate(45deg)}
.stars{color:var(--gold);letter-spacing:1px;font-size:14px}
.stars .off{color:var(--line)}
.thumbs{display:inline-flex;gap:4px;vertical-align:middle}
.thumbs img,.thumbs .fx{width:26px;height:26px;border-radius:5px;object-fit:cover;border:1px solid var(--line);background:var(--field);display:inline-flex;align-items:center;justify-content:center;font:600 8.5px var(--f-num);color:var(--muted)}
.err{color:var(--bad);font:500 12px var(--f-num)}
.gwrap{display:inline-block;min-width:100%;padding-bottom:40px}
.mute{color:var(--muted)}

/* ---- kartice ---- */
.gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px;padding:16px max(16px,env(safe-area-inset-right,0px)) 40px max(16px,env(safe-area-inset-left,0px))}

/* ---------- brojevi i datumi ---------- */
function pnum(v){
  if(v==null||v==='')return null;
  if(typeof v==='number')return isFinite(v)?v:null;
  if(typeof v==='boolean')return v?1:0;
  if(Array.isArray(v))return null;
  let s=String(v).trim().replace(/\s|€|eur|din\.?|rsd|%/gi,'');
  if(!s)return null;
  const c=s.lastIndexOf(','),d=s.lastIndexOf('.');
  if(c>-1&&d>-1){s=c>d?s.replace(/\./g,'').replace(',','.'):s.replace(/,/g,'')}
  else if(c>-1){s=(s.match(/,/g).length>1)?s.replace(/,/g,''):s.replace(',','.')}
  else if(d>-1&&/^-?\d{1,3}(\.\d{3})+$/.test(s))s=s.replace(/\./g,'');
  if(!/^-?\d*\.?\d+$/.test(s))return null;
  const n=Number(s);return isFinite(n)?n:null;
}
function fmtN(n,prec){
  if(n==null||!isFinite(n))return'';
  const neg=n<0;n=Math.abs(n);let s;
  if(prec==null||prec==='a'){s=String(Math.round(n*1000)/1000);if(/e/.test(s))s=n.toFixed(3)}else s=n.toFixed(prec);
  let [i,f]=s.split('.');i=i.replace(/\B(?=(\d{3})+(?!\d))/g,'.');
  return(neg?'−':'')+i+(f?','+f:'');
}
const pad=n=>String(n).padStart(2,'0');
const iso=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const todayISO=()=>iso(new Date());
function pdate(v){
  if(v==null||v==='')return null;
  if(typeof v==='number')return isFinite(v)?iso(new Date(v)):null;
  const s=String(v).trim();let m;
  const mk=(y,mo,d)=>{const dt=new Date(y,mo-1,d);return dt.getMonth()===mo-1&&dt.getDate()===d?iso(dt):null};
  if((m=s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/)))return mk(+m[1],+m[2],+m[3]);
  if((m=s.match(/^(\d{1,2})[.\/-]\s*(\d{1,2})(?:[.\/-]\s*(\d{2,4}))?\.?$/))){let y=m[3]?+m[3]:new Date().getFullYear();if(y<100)y+=2000;return mk(y,+m[2],+m[1])}
  return null;
}
const pdt=s=>{const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};

const fmtMs=ms=>ms?fmtD(iso(new Date(ms))):'';

/* ---------- normalizacija ---------- */
function normField(f){
  const o={id:String(f.id),name:String(f.name||'Polje').slice(0,80),type:f.type};
  if(f.type==='sel'||f.type==='multi')o.ch=(Array.isArray(f.ch)?f.ch:[]).filter(c=>c&&c.id).map(c=>({id:String(c.id),n:String(c.n||''),c:COLORS.includes(c.c)?c.c:'c8'}));
  if(f.type==='num')o.prec=(f.prec==null||f.prec==='a')?'a':Math.max(0,Math.min(4,+f.prec||0));
  if(f.type==='money'){o.prec=f.prec==null?2:Math.max(0,Math.min(4,+f.prec||0));o.cur=f.cur==='din'?'din':'eur'}
  if(f.type==='pct')o.prec=f.prec==null?0:Math.max(0,Math.min(4,+f.prec||0));
  if(f.type==='link')o.link={table:String(f.link&&f.link.table||''),inv:String(f.link&&f.link.inv||'')};
  if(f.type==='formula'){o.expr=String(f.expr||'');o.fmt=['auto','num','eur','din','text','date'].includes(f.fmt)?f.fmt:'auto';o.prec=f.prec==null?'a':f.prec}
  if(f.type==='rollup'){o.via=String(f.via||'');o.of=String(f.of||'');o.agg=['sum','avg','min','max','count','list'].includes(f.agg)?f.agg:'sum'}
  if(f.type==='mat')o.src=String(f.src||'f_proizvod');
  return o;
}
function defView(type,name){return{id:uid('v'),name:name||VNAMES[type||'grid'],type:type||'grid',filters:[],conj:'and',sort:[],group:'',hidden:[],w:{},kb:'',cover:'',dateF:''}}
function normView(v){return{id:String(v.id),name:String(v.name||'Prikaz').slice(0,60),type:VNAMES[v.type]?v.type:'grid',
  filters:(Array.isArray(v.filters)?v.filters:[]).filter(x=>x&&x.f).map(x=>({f:String(x.f),op:String(x.op||''),v:x.v==null?'':x.v})),
  conj:v.conj==='or'?'or':'and',sort:(Array.isArray(v.sort)?v.sort:[]).filter(s=>s&&s.f).map(s=>({f:String(s.f),d:s.d==='desc'?'desc':'asc'})),
  group:str(v.group),hidden:(Array.isArray(v.hidden)?v.hidden:[]).map(String),w:(v.w&&typeof v.w==='object'&&!Array.isArray(v.w))?Object.assign({},v.w):{},
  kb:str(v.kb),cover:str(v.cover),dateF:str(v.dateF)}}
function normTable(id,d){d=d||{};
  const fields=(Array.isArray(d.fields)?d.fields:[]).filter(f=>f&&f.id&&TYPES[f.type]).map(normField);
  if(!fields.length)fields.push({id:'fnaziv',name:'Naziv',type:'text'});
  let views=(Array.isArray(d.views)?d.views:[]).filter(v=>v&&v.id).map(normView);if(!views.length)views=[defView('grid')];
  return{id,name:String(d.name||'Tabela').slice(0,60),color:COLORS.includes(d.color)?d.color:'c1',order:typeof d.order==='number'?d.order:0,cat:typeof d.cat==='string'?d.cat.slice(0,40):'',fields,views,createdAt:d.createdAt||0}}
const tableOut=t=>({name:t.name,color:t.color,order:t.order,cat:t.cat||'',fields:clone(t.fields),views:clone(t.views),createdAt:t.createdAt||Date.now(),up:Date.now()});
function normRec(d){d=d||{};return{c:(d.c&&typeof d.c==='object'&&!Array.isArray(d.c))?d.c:{},at:typeof d.at==='number'?d.at:0,up:typeof d.up==='number'?d.up:0,by:typeof d.by==='string'?d.by:null}}
const recOut=r=>r?{c:clone(r.c),at:r.at||Date.now(),up:Date.now(),by:r.by||null}:null;
const rpath=(tid,rid)=>'tables/'+tid+'/records/'+rid;
function newId(col){try{if(db)return db.collection(col).doc().id}catch(e){}return uid(col[0])}
const recsOf=tid=>R.get(tid)||new Map();
const fieldOf=(t,fid)=>t&&t.fields.find(f=>f.id===fid);
const fieldByName=(t,n)=>t&&t.fields.find(f=>f.name.trim().toLowerCase()===String(n).trim().toLowerCase());

/* ================= čuvanje (red čekanja po dokumentu) ================= */
const W=new Map();let active=0;const waiters=[];
async function slot(){if(active<6){active++;return}await new Promise(r=>waiters.push(r));active++}
function freeSlot(){active--;const w=waiters.shift();if(w)w()}
function deepMerge(a,b){for(const k of Object.keys(b)){const v=b[k];if(v&&typeof v==='object'&&!Array.isArray(v)&&a[k]&&typeof a[k]==='object'&&!Array.isArray(a[k]))a[k]=deepMerge(Object.assign({},a[k]),v);else a[k]=v}return a}
function mergeOp(a,b){if(!a||b.k!=='patch')return b;if(a.k==='del')return{k:'set',d:b.full&&b.full(),full:b.full};
  if(a.k==='set')return{k:'set',d:deepMerge(clone(a.d),clone(b.d)),full:b.full};return{k:'patch',d:deepMerge(clone(a.d),clone(b.d)),full:b.full}}
function write(path,op){
  if(!db||readonly){return}
  dirty.add(path);let w=W.get(path);if(!w){w={busy:false,next:null};W.set(path,w)}
  w.next=mergeOp(w.next,op);if(!w.busy)runQ(path,w);
}
async function runQ(path,w){
  w.busy=true;let failed=false;
  while(w.next){const op=w.next;w.next=null;setConn('saving');
    await slot();
    try{
      const ref=db.doc(path);
      const go=()=>op.k==='del'?ref.delete():op.k==='set'?ref.set(op.d):ref.update(op.d);
      let err=null;
      try{await go()}catch(e){err=e}
      if(err&&err.code==='unavailable'){await sleep(400+Math.random()*800);try{await go();err=null}catch(e2){err=e2}}
      if(err&&op.k==='patch'&&err.code==='invalid_argument'&&op.full){const full=op.full();if(full){try{await ref.set(full);err=null}catch(e3){err=e3}}}
      if(err){failed=true;onErr(err)}
    }finally{freeSlot()}
  }
  w.busy=false;dirty.delete(path);
  if(!failed&&!readonly&&![...W.values()].some(x=>x.busy))setConn('ok');
  if(!failed)onData();
}
function onErr(e){const c=e&&e.code;
  if(c==='invalid_argument'||c==='not_granted'){readonly=true;setConn('ro');showBanner('Ovde možeš samo da gledaš — izmene se ne čuvaju.'+(window.__MT_PWA?' Javi Manuelu da ti da pravo izmene.':' Zamoli Manuela da te pozove mejlom sa pravom „Can edit“.'))}
  else if(c==='quota_exceeded'){setConn('err');toast('Baza je puna. Obriši stare zapise ili slike.')}
  else{setConn('err');toast('Nije sačuvano. Proveri internet i pokušaj ponovo.')}}
function showBanner(t){const b=$('banner');b.textContent=t;b.hidden=false}
function setConn(s){const t={ok:'Sačuvano',saving:'Čuvam…',off:'Nije povezano',err:'Greška pri čuvanju',ro:'Samo pregled',load:'Povezivanje…'}[s]||'';
  for(const id of ['conn','conn2']){const c=$(id);c.className='conn '+s;c.textContent=id==='conn2'?'':t;c.title=t}}

/* zapisi */
function patchRec(tid,rid,cPatch){
  const m=R.get(tid);const r=m&&m.get(rid);if(!r)return;
  const n={c:Object.assign({},r.c,cPatch),at:r.at,up:Date.now(),by:r.by};m.set(rid,n);
  write(rpath(tid,rid),{k:'patch',d:{c:clone(cPatch),up:n.up},full:()=>recOut(recsOf(tid).get(rid))});onData();
}
function setVal(tid,rid,f,v){
  const r=recsOf(tid).get(rid);if(!r||readonly&&db)return;
  const old=r.c[f.id];
  if(JSON.stringify(old)===JSON.stringify(v))return;
  patchRec(tid,rid,{[f.id]:v});
  if(f.type==='link')syncInverse(f,rid,Array.isArray(old)?old:[],Array.isArray(v)?v:[]);
  if(tid==='kupci'&&typeof pushClient==='function')pushClient(rid);
}
function syncInverse(f,rid,oldIds,newIds){
  const tt=f.link.table,inv=f.link.inv;if(!tt||!inv)return;
  const tab=T.get(tt);if(!tab||!fieldOf(tab,inv))return;
  const m=recsOf(tt);
  for(const id of newIds)if(!oldIds.includes(id)){const o=m.get(id);if(!o)continue;const a=Array.isArray(o.c[inv])?o.c[inv]:[];if(!a.includes(rid))patchRec(tt,id,{[inv]:a.concat(rid)})}
  for(const id of oldIds)if(!newIds.includes(id)){const o=m.get(id);if(!o)continue;const a=Array.isArray(o.c[inv])?o.c[inv]:[];if(a.includes(rid))patchRec(tt,id,{[inv]:a.filter(x=>x!==rid)})}
}
function createRec(tid,c,id){
  if(!R.has(tid))R.set(tid,new Map());
  id=id||newId('tables/'+tid+'/records');const now=Date.now();
  const rec={c:Object.assign({},c||{}),at:now,up:now,by:myId};R.get(tid).set(id,rec);
  write(rpath(tid,id),{k:'set',d:recOut(rec),full:()=>recOut(recsOf(tid).get(id))});
  const t=T.get(tid);if(t)for(const f of t.fields)if(f.type==='link'&&Array.isArray(rec.c[f.id]))syncInverse(f,id,[],rec.c[f.id]);
  onData();return id;
}
function deleteRec(tid,rid,silent){
  const m=recsOf(tid),r=m.get(rid);if(!r)return null;const copy=clone(r);const t=T.get(tid);

/* ================= filter, sortiranje, grupe ================= */
const OPS={
  text:[['has','sadrži'],['nhas','ne sadrži'],['is','je tačno'],['isnt','nije'],['empty','je prazno'],['full','nije prazno']],
  num:[['eq','='],['ne','≠'],['lt','<'],['le','≤'],['gt','>'],['ge','≥'],['empty','je prazno'],['full','nije prazno']],
  date:[['is','je'],['before','pre'],['after','posle'],['today','danas'],['past','prošao'],['next7','narednih 7 dana'],['empty','je prazno'],['full','nije prazno']],
  bool:[['yes','čekirano'],['no','nije čekirano']],
  sel:[['is','je'],['isnt','nije'],['empty','je prazno'],['full','nije prazno']],
  multi:[['has','sadrži'],['nhas','ne sadrži'],['empty','je prazno'],['full','nije prazno']],

    if(op==='today')return d===td;if(op==='past')return!!d&&d<td;if(op==='next7')return!!d&&d>=td&&d<=addDays(td,7);

  if(k==='num'){const x=pnum(flt.v);if(x==null)return true;const n=typeof v==='number'?v:null;if(n==null)return op==='ne';
    return{eq:n===x,ne:n!==x,lt:n<x,le:n<=x,gt:n>x,ge:n>=x}[op]??true}

  if(isLink&&!T.has(f.link.table)){toast('Povezana tabela ne postoji. Promeni polje.');return}

    const list=el('div','plist');p.appendChild(list);
    const draw=()=>{list.innerHTML='';const q=s.value.trim().toLowerCase();const cur=rec()?val(t,f,rec()):(multi?[]:null);
      let opts;if(isLink){const lt=T.get(f.link.table);opts=[...recsOf(lt.id).keys()].map(id=>({id,n:recName(lt.id,id)})).sort((a,b)=>coll.compare(a.n,b.n))}else opts=f.ch.map(c=>({id:c.id,n:c.n,c:c.c}));

        const b=mi(o.n,()=>{let nv;if(multi)nv=on?cur.filter(x=>x!==o.id):cur.concat(o.id);else nv=on?null:o.id;setVal(t.id,rid,f,nv);if(multi){draw()}else{closePop()}},{keep:multi,check:on});

async function shrink(file){
  if(!/^image\/(jpeg|png|webp)$/.test(file.type)||file.size<1.4e6)return file;
  try{const bmp=await createImageBitmap(file);const max=2400;const s=Math.min(1,max/Math.max(bmp.width,bmp.height));
    const cv0=document.createElement('canvas');cv0.width=Math.round(bmp.width*s);cv0.height=Math.round(bmp.height*s);cv0.getContext('2d').drawImage(bmp,0,0,cv0.width,cv0.height);
    const b=await new Promise(r=>cv0.toBlob(r,'image/jpeg',.86));if(b&&b.size<file.size)return new File([b],file.name.replace(/\.\w+$/,'')+'.jpg',{type:'image/jpeg'});}catch(e){}
  return file}
async function uploadFiles(t,f,rid,files){
  if(!assets){toast('Slike ovde nisu dostupne.');return}
  const key=t.id+'/'+rid+'/'+f.id;uploading[key]=(uploading[key]||0)+files.length;refreshRec();refreshJob();let ok=0;
  for(const file0 of files){try{
      if(!/^image\/|^application\/pdf$/.test(file0.type)&&!/\.pdf$/i.test(file0.name))throw{code:'unsupported_type'};
      const file=await shrink(file0);const r=await assets.upload(file);
      const now=val(t,f,recsOf(t.id).get(rid));setVal(t.id,rid,f,now.concat({id:r.id,url:r.url,name:file0.name,type:r.contentType||file.type,size:r.sizeBytes||file.size}));ok++;
    }catch(e){const c=e&&e.code;toast(c==='too_large'?'Fajl je prevelik (najviše 20 MB).':c==='unsupported_type'?'Mogu se dodati samo slike i PDF.':c==='quota_or_state'?'Prostor za slike je pun.':'Slanje nije uspelo. Pokušaj ponovo.')}
    uploading[key]--;refreshRec();refreshJob()}
  if(ok)toast(ok===1?'Fajl dodat':'Dodato fajlova: '+ok);
}

function applyField(t,orig,f,after){
  t=T.get(t.id);const changed=[];
  if(orig&&orig.name!==f.name){for(const x of t.fields)if(x.type==='formula'&&x.expr)x.expr=x.expr.split('{'+orig.name+'}').join('{'+f.name+'}')}
  /* veza: par u drugoj tabeli */
  const oldLink=orig&&orig.type==='link'?orig.link:null;
  if(oldLink&&oldLink.inv&&(f.type!=='link'||f.link.table!==oldLink.table)){const ot=T.get(oldLink.table);if(ot){ot.fields=ot.fields.filter(x=>x.id!==oldLink.inv);changed.push(ot)}if(f.type==='link')f.link.inv=''}
  if(f.type==='link'){if(oldLink&&oldLink.table===f.link.table)f.link.inv=oldLink.inv;
    if(!f.link.inv&&f.link.table&&f.link.table!==t.id){const tt=T.get(f.link.table);if(tt){const inv={id:uid('f'),name:uniqueName(tt,t.name),type:'link',link:{table:t.id,inv:f.id}};tt.fields.push(inv);f.link.inv=inv.id;changed.push(tt)}}}
  if(orig){const i=t.fields.findIndex(x=>x.id===orig.id);t.fields[i]=f}
  else{const i=after?t.fields.findIndex(x=>x.id===after):-1;if(i>=0)t.fields.splice(i+1,0,f);else t.fields.push(f);for(const v of t.views)v.hidden=v.hidden.filter(x=>x!==f.id)}
  saveTable(t,['fields','views']);for(const x of changed)if(x.id!==t.id)saveTable(x,['fields']);
  ensureDeps();toast(orig?'Polje sačuvano':'Polje „'+f.name+'“ dodato');
}

  const snap=[{t,fields:clone(t.fields),views:clone(t.views)}];
  if(f.type==='link'&&f.link.inv){const tt=T.get(f.link.table);if(tt&&tt.id!==t.id){snap.push({t:tt,fields:clone(tt.fields),views:clone(tt.views)});tt.fields=tt.fields.filter(x=>x.id!==f.link.inv);stripViews(tt,f.link.inv);saveTable(tt,['fields','views'])}}

const X={docs:new Map(),clients:new Map(),auto:new Map(),events:new Map(),tasks:new Map(),shopping:new Map(),settings:new Map()};

function subX(col){
  if(!db)return;
  try{db.collection(col).onSnapshot(snap=>{
    const m=new Map();for(const d of snap.docs)m.set(d.id,d.data());
    const old=X[col];for(const p of dirty){const s=p.split('/');if(s.length===2&&s[0]===col){if(old.has(s[1]))m.set(s[1],old.get(s[1]));else m.delete(s[1])}}
    X[col]=m;XL.add(col);onXData(col);
  },e=>{XL.add(col);if(e&&e.code==='unavailable')setTimeout(()=>subX(col),2500)})}catch(e){XL.add(col)}
}

const CMAP=[['f_ime','name'],['f_tel','phone'],['f_email','email'],['f_mesto','city'],['f_adresa','address'],['f_pib','pib'],['f_kontakt','contact']];
const KIND={fiz:'o_k_fiz',pra:'o_k_pra'};
function clientToRec(c){const o={};for(const [f,k] of CMAP){const v=c[k];if(v!=null&&String(v).trim()!=='')o[f]=String(v).trim()}if(KIND[c.kind])o.f_kvrsta=KIND[c.kind];return o}
let syncing=false;
function syncClients(){
  const kt=KT();if(!kt||kt.id!=='kupci'||!loadedR.has('kupci')||!XL.has('clients')||!XL.has('docs')||readonly||!db||syncing)return;
  syncing=true;try{
  const recs=recsOf('kupci');const byCid=new Map();for(const [rid,r] of recs)if(r.c._cid)byCid.set(r.c._cid,rid);
  const all=new Map(X.clients);
  for(const d of X.docs.values()){const c=d&&d.client;if(c&&c.id&&String(c.name||'').trim()&&!all.has(c.id)){const cc=Object.assign({},c);all.set(c.id,cc);xput('clients',c.id,cc)}}
  for(const [cid,c] of all){
    if(!String(c.name||'').trim())continue;
    if(dirty.has('clients/'+cid))continue;
    let rid=byCid.get(cid);
    if(!rid){const nn=ntxt(c.name),ph=String(c.phone||'').replace(/\D/g,'');
      const hit=[...recs].find(([,r])=>!r.c._cid&&(ntxt(r.c.f_ime)===nn||(ph.length>5&&String(r.c.f_tel||'').replace(/\D/g,'')===ph)));
      if(hit){rid=hit[0];patchRec('kupci',rid,{_cid:cid})}}
    const want=clientToRec(c);
    if(!rid){createRec('kupci',Object.assign({_cid:cid},want));continue}
    if(dirty.has(rpath('kupci',rid)))continue;
    const r=recs.get(rid);if(!r)continue;const patch={};for(const k in want)if(String(r.c[k]==null?'':r.c[k])!==want[k])patch[k]=want[k];
    if(Object.keys(patch).length)patchRec('kupci',rid,patch);
  }}finally{syncing=false}
}

  if(!db||readonly)return;const r=recsOf('kupci').get(rid);if(!r)return;const name=String(r.c.f_ime||'').trim();if(!name)return;
  const patch={};for(const [f,k] of CMAP)patch[k]=r.c[f]==null?'':String(r.c[f]);const kv=r.c.f_kvrsta;patch.kind=kv==='o_k_pra'?'pra':'fiz';

function pendingProposals(){
  const out=[];if(!XL.has('docs')||!XL.has('auto'))return out;const t=PT();if(!t||!loadedR.has(t.id))return out;const seen=new Set();

function docTotals(d){
  const st=X.settings.get('main')||{};const vat=(d.issuer!=='privatno')&&String(st.vatPayer==null?'1':st.vatPayer)!=='0';const rate=pnum(d.vatRate)??pnum(st.vatRate)??20;
  let sub=0;for(const i of d.items||[]){const q=pnum(i.q)??1,p=pnum(i.p)??0,ds=pnum(i.disc)??0;sub+=q*p*(1-ds/100)}
  const xd=pnum(d.extraDisc)??0;sub*=1-xd/100;sub+=pnum(d.shipping)??0;const tot=vat?sub*(1+rate/100):sub;
  const kurs=pnum(d.kurs)||pnum(st.kurs)||117.2;const toE=v=>d.currency==='EUR'?v:v/kurs;
  let av=pnum(d.avansAmount);if(av==null&&d.avansPct)av=tot*(pnum(d.avansPct)||0)/100;
  return{tot,totE:toE(tot),avE:av==null?null:toE(av),cur:d.currency||'RSD'}
}

async function fetchBlob(a){if(window.__mtFiles)return window.__mtFiles.blob(a);const u=assetUrl(a);const res=await fetch(u);if(!res.ok)throw new Error('fetch');return res.blob()}
async function imgData(a,max){const bl=await fetchBlob(a);const bmp=await createImageBitmap(bl);const s=Math.min(1,(max||2000)/Math.max(bmp.width,bmp.height));
  const c=document.createElement('canvas');c.width=Math.max(1,Math.round(bmp.width*s));c.height=Math.max(1,Math.round(bmp.height*s));const g=c.getContext('2d');g.fillStyle='#fff';g.fillRect(0,0,c.width,c.height);g.drawImage(bmp,0,0,c.width,c.height);
  return{url:c.toDataURL('image/jpeg',.88),w:c.width,h:c.height,canvas:c}}
const PDFJS=(window.__MT_LIBS&&window.__MT_LIBS.pdfjs)||'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js',PDFJSW=(window.__MT_LIBS&&window.__MT_LIBS.pdfjsw)||'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
async function pdfPages(a,maxPages){await loadScript(PDFJS);const lib=window.pdfjsLib;lib.GlobalWorkerOptions.workerSrc=PDFJSW;
  const buf=await(await fetchBlob(a)).arrayBuffer();const doc=await lib.getDocument({data:new Uint8Array(buf)}).promise;const out=[];
  for(let i=1;i<=Math.min(doc.numPages,maxPages||12);i++){const pg=await doc.getPage(i);const v0=pg.getViewport({scale:1});const sc=Math.min(3,2000/Math.max(v0.width,v0.height));const vp=pg.getViewport({scale:sc});
    const c=document.createElement('canvas');c.width=Math.round(vp.width);c.height=Math.round(vp.height);const g=c.getContext('2d');g.fillStyle='#fff';g.fillRect(0,0,c.width,c.height);await pg.render({canvasContext:g,viewport:vp}).promise;out.push({canvas:c,w:c.width,h:c.height,n:doc.numPages})}
  return out}
/* strana sa crtežom: slika + natpis, nacrtano na platnu (da rade i č, ć, đ) */
function drawingPage(pdf,src,caption,first){
  const land=src.w>src.h*1.08;const W=land?297:210,H=land?210:297;const px=8;const Wp=Math.round(W*px),Hp=Math.round(H*px);
  const c=document.createElement('canvas');c.width=Wp;c.height=Hp;const g=c.getContext('2d');g.fillStyle='#fff';g.fillRect(0,0,Wp,Hp);
  const m=Math.round(8*px),top=Math.round(15*px);g.fillStyle='#333F50';g.font='600 '+Math.round(3.6*px)+'px Figtree, Arial, sans-serif';g.textBaseline='alphabetic';
  g.fillText(caption.slice(0,140),m,Math.round(10*px));g.fillStyle='#B99C71';g.fillRect(m,Math.round(12*px),Wp-2*m,Math.max(2,Math.round(.5*px)));
  const aw=Wp-2*m,ah=Hp-top-m;const s=Math.min(aw/src.w,ah/src.h);const dw=src.w*s,dh=src.h*s;g.drawImage(src.canvas,m+(aw-dw)/2,top+(ah-dh)/2,dw,dh);
  if(!first)pdf.addPage('a4',land?'landscape':'portrait');else if(land){pdf.addPage('a4','landscape')}
  pdf.addImage(c.toDataURL('image/jpeg',.9),'JPEG',0,0,W,H);
}

/* Tekst jutarnjeg obaveštenja — isti u aplikaciji (dugme „Probaj“) i u programu koji šalje obaveštenja.
   data = {tasks:[{title,due,hot,next}], shop:[{name,qty,unit,store,hot,for}]}  (samo otvorene stavke)
   o    = {tasks:true|false, shop:'sve'|'kuca'|'radionica'|'ne'}
   today = 'YYYY-MM-DD' (lokalni datum)
   Vraća {title, body, m, n} ili null kad nema ničega za javiti. */
function podText(data, o, today) {
  o = o || {};
  const wantT = o.tasks !== false, wantS = o.shop || 'sve';
  const days = (a, b) => Math.round((Date.UTC(+a.slice(0, 4), +a.slice(5, 7) - 1, +a.slice(8, 10)) - Date.UTC(+b.slice(0, 4), +b.slice(5, 7) - 1, +b.slice(8, 10))) / 864e5);
  const okD = s => /^\d{4}-\d{2}-\d{2}/.test(String(s || ''));
  const cut = (s, n) => { s = String(s || '').replace(/\s+/g, ' ').trim(); return s.length > n ? s.slice(0, n - 1) + '…' : s };
  const lines = [], cnt = { hot: 0, late: 0, today: 0, tom: 0, shop: 0 };
  if (wantT) {
    const hot = [], late = [], tod = [], tom = [];
    for (const t of (data && data.tasks) || []) {
      if (!t || !t.title) continue;
      const d = okD(t.due) ? days(String(t.due).slice(0, 10), today) : null;
      if (t.hot) hot.push([t, d]);
      else if (d === null) continue;
      else if (d < 0) late.push([t, d]);
      else if (d === 0) tod.push([t, d]);
      else if (d === 1) tom.push([t, d]);
    }
    const rel = d => d === null ? '' : d < 0 ? ' (kasni ' + (-d) + ' d.)' : d === 0 ? ' (danas)' : d === 1 ? ' (sutra)' : '';
    late.sort((a, b) => a[1] - b[1]);
    for (const [t, d] of hot) lines.push('Hitno: ' + cut(t.title, 70) + rel(d));
    for (const [t, d] of late) lines.push('Kasni ' + (-d) + ' d.: ' + cut(t.title, 70));
    for (const [t] of tod) lines.push('Danas: ' + cut(t.title, 70));
    for (const [t] of tom) lines.push('Sutra: ' + cut(t.title, 70));
    cnt.hot = hot.length; cnt.late = late.length; cnt.today = tod.length; cnt.tom = tom.length;
  }
  if (wantS !== 'ne') {
    const n = s => String(s || '').toLowerCase().replace(/ć/g, 'c');
    const items = ((data && data.shop) || []).filter(x => {
      if (!x || !x.name) return false;
      const f = n(x.for);
      if (wantS === 'kuca') return !f || f.startsWith('kuc');
      if (wantS === 'radionica') return !f || f.startsWith('radion');
      return true;
    });
    const q = x => { const a = x.qty === '' || x.qty == null ? '' : String(x.qty); return a ? ' ' + a + (x.unit ? ' ' + x.unit : '') : '' };
    const by = new Map();
    for (const x of items.filter(x => x.hot).concat(items.filter(x => !x.hot))) {
      const k = String(x.store || '').trim() || 'bilo gde';
      if (!by.has(k)) by.set(k, []);
      by.get(k).push((x.hot ? '!' : '') + cut(x.name, 40) + q(x));
    }
    for (const [k, arr] of by) lines.push('Kupiti – ' + k + ': ' + arr.join(', '));
    cnt.shop = items.length;
  }
  if (!lines.length) return null;
  const parts = [];
  if (cnt.hot) parts.push(cnt.hot + ' hitno');
  if (cnt.late) parts.push(cnt.late + ' kasni');
  if (cnt.today) parts.push(cnt.today + ' danas');
  if (cnt.tom) parts.push(cnt.tom + ' sutra');
  if (cnt.shop) parts.push(cnt.shop + ' za kupiti');
  const MAX = 7;
  const body = lines.length > MAX ? lines.slice(0, MAX - 1).concat('+ još ' + (lines.length - MAX + 1)) : lines;
  const onlyShop = !(cnt.hot || cnt.late || cnt.today || cnt.tom);
  return { title: 'Martinov – ' + parts.join(', '), body: body.join('\n'), m: onlyShop ? 'kupovina' : 'zadaci', n: lines.length };
}

function parseDelim(s,d){const rows=[];let row=[],cell='',q=false;
  for(let i=0;i<s.length;i++){const ch=s[i];
    if(q){if(ch==='"'){if(s[i+1]==='"'){cell+='"';i++}else q=false}else cell+=ch;continue}
    if(ch==='"'&&cell===''){q=true;continue}
    if(ch===d){row.push(cell);cell='';continue}
    if(ch==='\n'||ch==='\r'){if(ch==='\r'&&s[i+1]==='\n')i++;row.push(cell);rows.push(row);row=[];cell='';continue}
    cell+=ch}
  if(cell!==''||row.length){row.push(cell);rows.push(row)}return rows}
function parseText(s){s=s.replace(/^﻿/,'');const first=s.split(/\r?\n/)[0]||'';const cnt=c=>first.split(c).length-1;
  const d=cnt('\t')?'\t':cnt(';')>=cnt(',')&&cnt(';')?';':',';return parseDelim(s,d).filter(r=>r.some(c=>String(c).trim()!==''))}
function guessType(vals){const v=vals.map(x=>String(x??'').trim()).filter(Boolean);if(!v.length)return{type:'text'};
  if(v.every(x=>/^-?[\d.,\s]+\s*(€|eur|din\.?|rsd)?$/i.test(x)&&pnum(x)!=null)){if(v.some(x=>/€|eur/i.test(x)))return{type:'money',cur:'eur',prec:2};if(v.some(x=>/din|rsd/i.test(x)))return{type:'money',cur:'din',prec:2};return{type:'num',prec:'a'}}
  if(v.every(x=>/^(\d{1,2}[.\/-]\d{1,2}[.\/-]\d{2,4}\.?|\d{4}-\d{2}-\d{2})/.test(x)&&pdate(x)))return{type:'date'};
  if(v.every(x=>/^(da|ne|x|true|false|✓|yes|no)$/i.test(x)))return{type:'check'};
  const uniq=[...new Set(v)];if(v.length>=6&&uniq.length<=12&&uniq.length<=v.length/2&&uniq.every(x=>x.length<=30))return{type:'sel',ch:uniq.map((n,i)=>({id:uid('o'),n,c:COLORS[i%8]}))};
  if(v.some(x=>x.length>90||x.includes('\n')))return{type:'long'};return{type:'text'}}
function openImport(tid){
  if(readonly)return toastRO();
  let data=null,fileName='';
  openDlg(tid?'Uvezi u „'+T.get(tid).name+'“':'Uvezi iz Excela',b=>{
    const drop=el('div','drop');drop.innerHTML='<b>Izaberi Excel ili CSV fajl</b><span class="note">.xlsx, .xls ili .csv — prvi red su nazivi kolona</span>';
    const fi=el('input');fi.type='file';fi.accept='.xlsx,.xls,.csv,.tsv,.txt';fi.hidden=true;const pick=el('button','btn','Izaberi fajl');pick.type='button';pick.addEventListener('click',()=>fi.click());drop.append(pick,fi);b.appendChild(drop);
    const ta=el('textarea');ta.rows=4;ta.placeholder='…ili označi tabelu u Excelu, kopiraj (Ctrl+C) i nalepi ovde (Ctrl+V)';b.appendChild(fld('Nalepi',ta));
    const pv=el('div');b.appendChild(pv);
    const nameIn=el('input');nameIn.placeholder='Naziv nove tabele';const nameF=fld('Naziv nove tabele',nameIn);if(tid)nameF.hidden=true;b.appendChild(nameF);
    const bot=el('div','ebot');const go=el('button','btn pri','Uvezi');go.type='button';go.disabled=true;const cancel=el('button','btn','Otkaži');cancel.type='button';cancel.addEventListener('click',closeDlg);bot.append(go,cancel);b.appendChild(bot);
    const show=rows=>{data=rows&&rows.length?rows:null;pv.innerHTML='';go.disabled=!data||data.length<2;
      if(!data){pv.appendChild(el('div','note','Nisam našao redove.'));return}
      const head=data[0].map((h,i)=>String(h||'').trim()||'Kolona '+(i+1));
      const n=data.length-1;pv.appendChild(el('div','note',n+(n%10===1&&n%100!==11?' red':' redova')+', '+head.length+' kolona'+(tid?'. Kolone sa istim nazivom idu u postojeća polja, ostale se dodaju.':'')));
      const w=el('div','tbl-prev');const tb=el('table');const tr=el('tr');for(const h of head)tr.appendChild(el('th',null,h));tb.appendChild(tr);
      for(const r of data.slice(1,7)){const x=el('tr');head.forEach((_,i)=>x.appendChild(el('td',null,String(r[i]??''))));tb.appendChild(x)}w.appendChild(tb);pv.appendChild(w);
      if(!tid&&!nameIn.value)nameIn.value=fileName.replace(/\.[^.]+$/,'')||'Uvezena tabela'};
    ta.addEventListener('input',()=>{fileName='';show(parseText(ta.value))});
    const readFile=async file=>{fileName=file.name;pv.innerHTML='';pv.appendChild(el('div','note','Čitam „'+file.name+'“…'));
      try{if(/\.(xlsx|xls)$/i.test(file.name)){const X=await loadXLSX();const wb=X.read(await file.arrayBuffer(),{type:'array',cellDates:true});const ws=wb.Sheets[wb.SheetNames[0]];
          const rows=X.utils.sheet_to_json(ws,{header:1,raw:true,defval:''}).map(r=>r.map(c=>c instanceof Date?iso(new Date(c.getTime()+12*36e5)):c));show(rows.filter(r=>r.some(c=>String(c).trim()!=='')))}
        else show(parseText(await file.text()))}catch(e){pv.innerHTML='';pv.appendChild(el('div','note','Ne mogu da pročitam fajl. Probaj da ga sačuvaš kao CSV, ili kopiraj i nalepi tabelu.'))}};
    fi.addEventListener('change',()=>{if(fi.files[0])readFile(fi.files[0])});
    drop.addEventListener('dragover',e=>{e.preventDefault();drop.classList.add('over')});drop.addEventListener('dragleave',()=>drop.classList.remove('over'));
    drop.addEventListener('drop',e=>{e.preventDefault();drop.classList.remove('over');const f=e.dataTransfer.files[0];if(f)readFile(f)});
    go.addEventListener('click',()=>{if(!data)return;closeDlg();doImport(tid,data,nameIn.value.trim()||'Uvezena tabela')});
  });
}
function doImport(tid,data,name){
  const head=data[0].map((h,i)=>String(h||'').trim()||'Kolona '+(i+1));const rows=data.slice(1);
  let t;const map=[];
  if(!tid){const fields=head.map((h,i)=>{const g=i===0?{type:'text'}:guessType(rows.map(r=>r[i]));return normField(Object.assign({id:uid('f'),name:h.slice(0,80)},g))});
    fields.forEach((f,i)=>{f.name=uniqueName({fields:fields.slice(0,i)},f.name)});
    tid=createTable(uniqueTableName(name),fields,[defView('grid')]);t=T.get(tid);head.forEach((h,i)=>map.push(t.fields[i]))}
  else{t=T.get(tid);let added=false;
    head.forEach((h,i)=>{let f=fieldByName(t,h);if(!f||CALC.has(f.type)){f=normField(Object.assign({id:uid('f'),name:uniqueName(t,h)},guessType(rows.map(r=>r[i]))));t.fields.push(f);added=true}map.push(f)});
    head.forEach((h,i)=>{const f=map[i];if(f.type!=='sel'&&f.type!=='multi')return;for(const r of rows){const vals=f.type==='sel'?[r[i]]:String(r[i]??'').split(/\s*[,;]\s*/);
      for(const x of vals){const s=String(x??'').trim();if(s&&!choice(f,s)){f.ch.push({id:uid('o'),n:s,c:COLORS[f.ch.length%8]});added=true}}}});
    if(added)saveTable(t,['fields'])}
  let n=0;
  for(const r of rows){const c={};map.forEach((f,i)=>{let v=r[i];if(v==null||String(v).trim()==='')return;
      if(f.type==='link'){const lt=T.get(f.link.table);if(!lt)return;const ids=[];for(const nm of String(v).split(/\s*[,;]\s*/)){const hit=[...recsOf(lt.id)].find(([,x])=>recName(lt.id,null,x).toLowerCase()===nm.toLowerCase());if(hit)ids.push(hit[0])}if(ids.length)c[f.id]=ids;return}
      if(f.type==='att')return;
      if(typeof v==='number'&&TYPES[f.type].k!=='num'&&f.type!=='date')v=String(v);
      if(f.type==='sel'){const ch=choice(f,v);if(ch)c[f.id]=ch.id;return}
      if(f.type==='multi'){c[f.id]=String(v).split(/\s*[,;]\s*/).map(x=>choice(f,x)).filter(Boolean).map(ch=>ch.id);return}
      if(TYPES[f.type].k==='num'){const x=pnum(v);if(x!=null)c[f.id]=x;return}
      if(f.type==='date'){const x=pdate(v);if(x)c[f.id]=x;return}
      if(f.type==='check'){c[f.id]=/^(da|true|1|x|✓|yes|d)$/i.test(String(v).trim());return}
      c[f.id]=String(v)});
    createRec(tid,c);n++}
  openTable(tid);toast('Uvezeno zapisa: '+n);
}

let qT=null;$('q').addEventListener('input',e=>{clearTimeout(qT);qT=setTimeout(()=>{ui.q=e.target.value;if(!isMod(ui.t))renderContent()},120)});
let wasNarrow=narrow();window.addEventListener('resize',()=>{clearTimeout(qT);qT=setTimeout(()=>{if(ui.edit)return;const n=narrow();if(!isMod(ui.t))renderContent();else if(n!==wasNarrow&&MODS[modKey(ui.t)]&&!MODS[modKey(ui.t)].app)renderModule();wasNarrow=n},150)});

render();
(async()=>{
  try{db=window.claude&&window.claude.use?await window.claude.use('db'):null}catch(e){db=null}
  if(!db){noDb=true;loadedT=true;setConn('off');showBanner('Baza nije povezana, pa se ništa ne čuva. Otvori ovu stranicu iz Claude aplikacije ili prijavljen na claude.ai.');render();return}
  setConn('load');
  try{user=await window.claude.use('user');if(user){myId=await user.id();const w=await user.can('data.write');if(w===false){readonly=true;setConn('ro');showBanner('Ovde možeš samo da gledaš. Za izmene zamoli Manuela da te pozove mejlom sa pravom „Can edit“.')}}}catch(e){}
  window.claude.use('assets').then(a=>{assets=a;refreshRec()},()=>{});
  window.claude.use('downloads').then(d=>{downloads=d},()=>{});
  const sub=()=>{try{db.collection('tables').onSnapshot(snap=>{
    const m=new Map();for(const d of snap.docs)m.set(d.id,normTable(d.id,d.data()));
    for(const p of dirty){const s=p.split('/');if(s.length===2&&s[0]==='tables'){if(T.has(s[1]))m.set(s[1],T.get(s[1]));else m.delete(s[1])}}
    T.clear();for(const [k,v] of m)T.set(k,v);const first=!loadedT;loadedT=true;
    if(first&&!readonly)setConn('ok');
    for(const id of ['poslovi','kupci','proizvodi','stakupiti'])if(T.has(id))ensureRecs(id);
    if(ui.t&&T.has(ui.t))ensureDeps();if(first){ensureSchema()}
    if(first)for(const id of ['poslovi','kupci','proizvodi','stakupiti'])if(T.has(id))for(const d of depsOf(id))ensureRecs(d);
    for(const id of [...subs.keys()])if(!T.has(id)){try{subs.get(id)()}catch(e){}subs.delete(id)}
    onData();
  },e=>{if(e&&e.code==='unavailable'){setTimeout(sub,2000);return}loadedT=true;setConn('off');showBanner('Veza sa bazom je prekinuta. Osveži stranicu.');onData()})}catch(e){loadedT=true;onData()}};
  sub();
  for(const c of ['docs','clients','auto','events','tasks','shopping','settings'])subX(c);
})();
})();
